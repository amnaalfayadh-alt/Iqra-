<!doctype html>
<html lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#FFFFFF">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0;font-family:system-ui,sans-serif;font-size:14px}img{max-width:100%}[hidden]{display:none!important}</style>
<title>اقرأ Steps</title>
<link rel="stylesheet" href="fonts/fonts.css">
<style>
/* Layout: one-screen kid app — top bar, scrolling view, fat bottom tab bar */
:root{
  /* bright, happy palette on a white page (single light theme by request) */
  --bg:#FFFFFF; --surface:#FFFFFF; --tint:#F6F9FB; --ink:#34475B; --muted:#718293;
  --sun:#F8DFA2; --leaf:#78BBA7; --coral:#F4B8A9; --sky:#A8C9EB; --grape:#CDB8F0; --line:#E3EAEF;
  --display:"Baloo 2",ui-rounded,system-ui,sans-serif;
  --body:"Nunito",system-ui,sans-serif;
  --arabic:"Amiri Quran","Amiri","Noto Naskh Arabic","Geeza Pro",serif;
  color-scheme:light;
}
html,body{height:100%}
body{background:#FFFFFF;color:var(--ink);font-family:var(--body);font-size:16px;display:flex;flex-direction:column}
*{box-sizing:border-box}
button{font:inherit;color:inherit;cursor:pointer;border:0;background:none}
button:focus-visible{outline:3px solid var(--sky);outline-offset:2px}
.top{display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:12px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.brand{font-family:var(--display);font-weight:800;font-size:1.4rem;line-height:1}
.brand small{display:block;font-family:var(--body);font-weight:700;font-size:.72rem;color:var(--muted);letter-spacing:.06em;text-transform:uppercase}
.pill{font-family:var(--display);font-weight:700;background:var(--surface);border:2px solid var(--line);border-radius:999px;padding:4px 12px;font-variant-numeric:tabular-nums}
main{flex:1;overflow-y:auto;padding-block:4px 24px;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
.wrap{max-width:760px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2{font-family:var(--display);margin:0;text-wrap:balance;line-height:1.1}
h1{font-size:1.7rem} h2{font-size:1.25rem}
p{margin:0;line-height:1.5;color:var(--muted)}
.ar{font-family:var(--arabic);direction:rtl}
/* path */
.path{display:flex;flex-direction:column;gap:14px}
.step{display:flex;align-items:center;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:14px;text-align:left;width:100%}
.step .badge{flex:none;width:64px;height:64px;border-radius:20px;display:grid;place-items:center;font-size:2rem;color:#16324F}
.step:nth-child(2n){margin-left:8%}.step:nth-child(3n){margin-left:3%}
.step .t{min-width:0;flex:1}.step .t b{font-family:var(--display);font-size:1.1rem;display:block}
.lvl{font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;color:var(--muted)}
.lock{font-size:.8rem;font-weight:700;background:var(--tint);border-radius:999px;padding:3px 10px;color:var(--muted)}
/* letters */
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:10px;direction:rtl}
.tile{background:var(--surface);border:2px solid var(--line);border-radius:18px;aspect-ratio:1;display:grid;place-items:center;font-family:var(--arabic);font-size:2.3rem;line-height:1;transition:transform .15s}
.tile:active,.tile.on{transform:scale(.94);border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 14%,var(--surface))}
.focus{background:var(--surface);border:2px solid var(--line);border-radius:26px;padding:18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center}
.big{font-family:var(--arabic);font-size:6rem;line-height:1.3;direction:rtl}
.row{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.btn{font-family:var(--display);font-weight:700;font-size:1.05rem;border-radius:999px;padding:10px 20px;background:var(--sun);color:#16324F;box-shadow:0 4px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn:active{transform:translateY(3px);box-shadow:0 1px 0 color-mix(in srgb,var(--sun) 60%,#000)}
.btn.rec{background:var(--coral);box-shadow:0 4px 0 color-mix(in srgb,var(--coral) 60%,#000)}
.btn.rec.live{animation:pulse 1s infinite}
.btn.ghost{background:var(--surface);color:var(--ink);border:2px solid var(--line);box-shadow:none}
@keyframes pulse{50%{transform:scale(1.06)}}
.note{font-size:.85rem;color:var(--muted);max-width:42ch}
.back{font-weight:700;color:var(--sky);align-self:flex-start;padding:4px 0}
.harakat{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:10px;width:100%}
.harakat button{background:var(--tint);border:2px solid var(--line);border-radius:20px;padding:8px 4px}
.harakat .ar{font-size:3.4rem;line-height:1.4;display:block}
.harakat small{font-weight:700;color:var(--muted)}
.word{font-family:var(--arabic);font-size:3.2rem;direction:rtl;line-height:1.5;display:flex;gap:4px;justify-content:center;flex-wrap:wrap}
.word span{padding:0 6px;border-radius:12px;transition:background .2s}
.word span.hi{background:color-mix(in srgb,var(--sun) 55%,transparent)}
/* games */
.games{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:12px}
.gcard{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:16px;text-align:left;display:flex;flex-direction:column;gap:8px}
.gcard .ic{font-family:var(--arabic);font-size:2.4rem;line-height:1.2;direction:rtl}
.choices{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px;width:100%;max-width:360px}
.choices button{background:var(--tint);border:3px solid var(--line);border-radius:24px;aspect-ratio:1.3;font-family:var(--arabic);font-size:3rem}
.choices button.good{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 22%,var(--surface))}
.choices button.bad{border-color:var(--coral);animation:shake .3s}
.choices.three{grid-template-columns:repeat(3,minmax(0,1fr))}
.choices.three button{font-family:var(--display);font-size:1.3rem;aspect-ratio:1}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.meter{font-family:var(--display);font-weight:700;font-variant-numeric:tabular-nums}
.bubbles{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:10px;width:100%;max-width:380px;direction:rtl}
.bubbles button{aspect-ratio:1;border-radius:50%;background:var(--tint);border:3px solid var(--line);font-family:var(--arabic);font-size:2rem}
.bubbles button.pop{border-color:var(--leaf);background:var(--leaf);color:#fff;transform:scale(.9)}
.playbar{background:var(--ink);color:var(--bg);border-radius:24px;padding:16px;display:flex;flex-direction:column;gap:12px}
.playbar p{color:color-mix(in srgb,var(--bg) 75%,transparent)}
.chips{display:flex;gap:10px;overflow-x:auto;padding-bottom:4px;scrollbar-width:none}
.chip{flex:none;display:flex;flex-direction:column;align-items:center;gap:2px;min-width:96px;border-radius:18px;padding:10px 12px;font-family:var(--display);font-weight:700;color:#16324F}
.chip .ar{font-size:1.6rem;line-height:1.3}
.gic{display:inline-grid;place-items:center;min-width:64px;height:56px;padding:0 12px;border-radius:16px;font-size:1.7rem;line-height:1;color:#16324F;align-self:flex-start}
.choices .rule{aspect-ratio:auto;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.9rem}
.choices .rule small{font-family:var(--display);font-size:1rem;color:var(--muted)}
.mem{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:8px;width:100%;max-width:400px}
.card{aspect-ratio:.8;border-radius:16px;background:var(--sky);border:3px solid var(--sky);display:grid;place-items:center;font-family:var(--display);font-weight:800;font-size:1.3rem;transition:transform .2s}
.card span{visibility:hidden}
.card.arc{font-family:var(--arabic);font-weight:400;font-size:2.2rem}
.card.up{background:var(--surface);transform:rotateY(180deg) scaleX(-1)}
.card.up span{visibility:visible}
.card.done{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 22%,var(--surface))}
.forms{display:grid;grid-template-columns:repeat(auto-fit,minmax(90px,1fr));gap:10px;width:100%}
.forms button{background:var(--tint);border:2px solid var(--line);border-radius:20px;padding:8px 4px;display:flex;flex-direction:column;align-items:center}
.forms .ar{font-size:3.2rem;line-height:1.5}
.forms small{font-weight:700;color:var(--muted)}
.tile.sm{font-size:1.7rem;border-radius:14px}
.grid:has(.sm){grid-template-columns:repeat(auto-fill,minmax(48px,1fr));gap:6px}
.chips.tabs{width:100%}
.chip.sm{min-width:0;flex-direction:row;padding:6px 14px;background:var(--surface);border:2px solid var(--line);color:var(--ink)}
.chip.sm .ar{font-size:1.3rem}
.chip.sm.on{background:var(--sun);border-color:var(--sun);color:#16324F}
.lock.free{background:color-mix(in srgb,var(--leaf) 20%,transparent);color:var(--ink)}
.choices.rules button{aspect-ratio:auto;padding:12px 6px;display:flex;flex-direction:column;align-items:center;gap:2px;font-size:1.8rem;line-height:1.4}
.choices.rules small{font-family:var(--display);font-size:.95rem;color:var(--muted);line-height:1.2}
.mk{font-size:2.4rem}
.hud{display:flex;gap:6px;align-items:center;flex-wrap:wrap;justify-content:flex-end}
.who{display:flex;align-items:center;gap:4px;font-family:var(--display);font-weight:700;background:var(--sun);color:#16324F;border-radius:999px;padding:4px 12px 4px 6px;max-width:150px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.who span{font-size:1.2rem}
@media (max-width:420px){.brand small{display:none}.pill{padding:4px 8px}}
.bar{height:10px;border-radius:999px;background:var(--line);overflow:hidden;margin-top:8px}
.bar span{display:block;height:100%;background:var(--leaf);border-radius:999px}
.step.done{border-color:var(--leaf)}
.big.mid{font-size:3.6rem}
.sign{font-family:var(--arabic);font-size:1.2em;color:var(--coral)}
.tile.wide{aspect-ratio:auto;padding:6px 8px;font-size:1.4rem;line-height:1.6}
.grid:has(.wide){grid-template-columns:repeat(auto-fill,minmax(72px,1fr))}
.mushaf{border-color:var(--sun);border-width:3px}
.ayat{display:flex;flex-direction:column;gap:6px;width:100%}
.ayah{font-family:var(--arabic);direction:rtl;text-align:right;font-size:1.8rem;line-height:2.1;padding:6px 12px;border-radius:14px}
.ayah.hi{background:color-mix(in srgb,var(--sun) 40%,transparent)}
.ayah.basm{text-align:center;font-size:1.6rem}
.num{color:var(--leaf);font-size:.85em}
.choices .num{font-family:var(--display);font-weight:800;font-size:2rem;aspect-ratio:auto;padding:16px}
.findme{font-family:var(--display);font-weight:800;font-size:2.4rem;line-height:1;color:var(--leaf)}
.choices.small button{font-size:2.4rem;line-height:1.5}
.choices.wide{grid-template-columns:repeat(3,minmax(0,1fr));max-width:400px}
.cert{background:var(--sun);border-radius:28px;padding:10px}
.cert-in{background:var(--surface);border:3px dashed var(--sun);border-radius:20px;padding:24px 16px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.cert-top{font-size:2.4rem;color:var(--leaf)}
.cert h1{font-size:2.2rem}
.cert-stars{font-size:2rem;color:var(--sun);letter-spacing:.2em}
.kidcard{align-items:center;text-align:center}
.kidcard.on{border-color:var(--leaf);border-width:3px}
.av{font-size:2.6rem;line-height:1}
.av.sm{font-size:1.6rem}
.avpick{font-size:1.7rem;width:48px;height:48px;border-radius:14px;border:2px solid var(--line);background:var(--tint)}
.avpick.on{border-color:var(--leaf);background:color-mix(in srgb,var(--leaf) 20%,var(--surface))}
input{font:inherit;font-size:1.1rem;padding:10px 14px;border-radius:14px;border:2px solid var(--line);background:var(--tint);color:var(--ink);width:100%}
input:focus{outline:3px solid var(--sky);outline-offset:1px}
.curr{margin:0;padding-left:22px;line-height:1.7}
/* Arabic-first: big Arabic, small English helper */
.bi{display:inline-flex;flex-direction:column;align-items:center;gap:.4em;line-height:1.5}
.bi .ar{font-size:1.15em;line-height:1.75;padding-bottom:.1em}
.bi small{display:block;font-family:var(--body);font-size:.72rem;font-weight:700;line-height:1.3;color:var(--muted);direction:ltr;unicode-bidi:isolate}
.btn .bi small{color:inherit;opacity:.72;font-size:.66rem}
.bi.h .ar{font-size:1.65rem}
.bi.name .ar{font-size:2.1rem}
.bi.title{align-items:flex-start}.bi.title .ar{font-size:2.3rem;line-height:1.4}.bi.title small{font-size:.85rem}
.ask .ar{font-size:1.5rem}
.findme{font-weight:400}.findme .ar{font-size:2.6rem;color:var(--leaf);line-height:1.5}.findme small{font-size:1rem}
.fb{font-size:1.5rem;color:var(--leaf);min-height:1.5em}
.pa{font-size:1.15rem;color:var(--muted)}
.ua{display:block;font-size:1.45rem;font-weight:400;line-height:1.5}
.step .en,.gcard small,.rule small{font-family:var(--body);font-size:.78rem;font-weight:700;color:var(--muted)}
.step,.gcard{text-align:start}
.gcard .bi{align-items:flex-start}
.forms .fname{font-size:1.05rem;color:var(--ink);line-height:1.4}
.choices .on{font-size:1.25rem;color:var(--ink);line-height:1.4}
.card.nm{font-size:1.45rem}
.chip .cn{font-size:1rem;line-height:1.4}.chip small{font-family:var(--body);font-size:.62rem;opacity:.8}
nav button .tn{font-size:1.05rem;line-height:1.3}nav button small{font-size:.62rem;font-family:var(--body)}
p,.note,small{unicode-bidi:plaintext}
.ltr{display:flex;flex-direction:column;gap:18px}
.ltr .gcard,.ltr .plan{text-align:left}
.snd{cursor:pointer;font-size:1rem}
/* breathing room between Arabic and its English helper everywhere */
.btn{line-height:1.4;padding:12px 22px}
.btn .bi{gap:.3em}
.chip{gap:6px;padding:12px 12px 10px}.chip .ar{line-height:1.6}.chip small{line-height:1.3;margin-top:2px}
.step .t{display:flex;flex-direction:column;gap:4px}.step .ua{line-height:1.7}.step .en{line-height:1.3}
.forms button{gap:6px;padding:10px 4px}.forms .fname{line-height:1.6}
.choices .rule,.choices.rules button{gap:6px}.choices .on{line-height:1.6}
.findme .bi{gap:.5em}
.cert-in{gap:12px}
/* plans */
.plans{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:12px}
.plan{background:var(--surface);border:2px solid var(--line);border-radius:22px;padding:18px;display:flex;flex-direction:column;gap:10px}
.plan.best{border-color:var(--leaf);border-width:3px}
.price{font-family:var(--display);font-weight:800;font-size:2rem;line-height:1}
.price small{font-size:.9rem;color:var(--muted);font-weight:500}
.plan ul{margin:0;padding-left:18px;line-height:1.6}
.tag{align-self:flex-start;font-size:.72rem;font-weight:700;letter-spacing:.06em;text-transform:uppercase;background:var(--leaf);color:#fff;border-radius:999px;padding:3px 10px}
/* tabs */
nav{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));background:var(--surface);border-top:2px solid var(--line);padding-block:6px calc(6px + env(safe-area-inset-bottom,0px));padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
nav button{font-family:var(--display);font-weight:700;padding:8px;border-radius:16px;display:flex;flex-direction:column;align-items:center;gap:2px;color:var(--muted)}
nav button .ar{font-size:1.5rem;line-height:1.2}
nav button[aria-current="true"]{color:var(--ink);background:color-mix(in srgb,var(--sun) 35%,transparent)}
.toast{position:fixed;left:50%;top:calc(70px + env(safe-area-inset-top,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);font-family:var(--display);font-weight:700;padding:10px 20px;border-radius:999px;z-index:20}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
/* buddy, celebrations, stickers */
.greet{display:flex;align-items:center;gap:12px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:12px 14px}
.gpal{font-size:3rem;line-height:1;animation:bob 2.4s ease-in-out infinite}
.gtxt{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.gtxt b{font-size:1.35rem;font-weight:400;line-height:1.6}.gtxt span{font-size:1.05rem;color:var(--muted);line-height:1.6}
.gside{display:flex;flex-direction:column;align-items:center;gap:6px}
.ring{width:58px;height:58px;transform:rotate(-90deg)}
.ring .rbg{fill:none;stroke:var(--line);stroke-width:7}.ring .rfg{fill:none;stroke:var(--leaf);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .6s}
.ring .rtx{transform:rotate(90deg);transform-origin:32px 32px;font-family:var(--display);font-weight:800;font-size:17px;fill:var(--ink)}
.albbtn{display:flex;align-items:center;gap:4px;background:var(--sun);color:#16324F;border-radius:999px;padding:2px 10px;font-weight:700}
.albbtn .ar{font-size:1rem}
@keyframes bob{50%{transform:translateY(-5px) rotate(-4deg)}}
#pal{position:fixed;z-index:30;left:max(12px,env(safe-area-inset-left,0px));bottom:calc(96px + env(safe-area-inset-bottom,0px));display:flex;align-items:flex-end;gap:6px;pointer-events:none;opacity:0;transform:translateY(16px) scale(.9);transition:opacity .25s,transform .25s;max-width:calc(100% - 24px)}
#pal.show{opacity:1;transform:none}
#pal .pf{font-size:2.8rem;line-height:1}
#pal.show .pf{animation:hop .5s}
#pal.big .pf{animation:hop .4s 3}
#pal .pb{background:var(--surface);color:var(--ink);border:2px solid var(--leaf);border-radius:18px 18px 18px 4px;padding:8px 14px;font-size:1.25rem;line-height:1.6;box-shadow:0 6px 18px rgba(0,0,0,.12)}
#pal.soft .pb{border-color:var(--sky)}
#pal.big .pb{border-color:var(--sun);background:color-mix(in srgb,var(--sun) 25%,var(--surface))}
@keyframes hop{30%{transform:translateY(-14px)}60%{transform:translateY(0)}80%{transform:translateY(-5px)}}
#confetti{position:fixed;inset:0;width:100%;height:100%;pointer-events:none;z-index:40}
#gift{position:fixed;inset:0;z-index:35;background:rgba(10,25,40,.45);display:grid;place-items:center;padding:16px}
#gift[hidden]{display:none!important}
.giftbox{background:var(--surface);border-radius:28px;padding:22px 18px;max-width:340px;width:100%;display:flex;flex-direction:column;align-items:center;gap:10px;text-align:center;animation:pop .35s}
.gs{font-size:5.5rem;line-height:1.1;animation:hop .7s .2s}
.gt{font-size:1.7rem;line-height:1.6}.gr{font-size:1.15rem;color:var(--muted);line-height:1.7}.gc{font-family:var(--display);color:var(--leaf);font-size:1.1rem}
@keyframes pop{from{transform:scale(.7);opacity:0}}
.album{display:grid;grid-template-columns:repeat(auto-fill,minmax(64px,1fr));gap:10px}
.stk{aspect-ratio:1;display:grid;place-items:center;font-size:2.4rem;background:var(--surface);border:2px solid var(--line);border-radius:18px}
.stk.lockd{font-family:var(--display);font-weight:800;font-size:1.6rem;color:var(--muted);background:var(--tint);border-style:dashed}
.howto{margin:0;padding-right:22px;line-height:2;font-size:1.1rem}
.hint{animation:glow 1s ease-in-out infinite;border-color:var(--sun)!important;box-shadow:0 0 0 4px color-mix(in srgb,var(--sun) 55%,transparent)}
@keyframes glow{50%{box-shadow:0 0 0 9px color-mix(in srgb,var(--sun) 25%,transparent)}}
@media (prefers-reduced-motion:reduce){.gpal,#pal .pf,.gs,.hint{animation:none!important}}
/* parent dashboard */
.dash{display:flex;flex-direction:column;gap:14px;background:var(--surface);border:2px solid var(--line);border-radius:24px;padding:16px}
.dash select{font:inherit;padding:6px 10px;border-radius:12px;border:2px solid var(--line);background:var(--tint);color:var(--ink)}
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:10px}
.kpi{background:var(--tint);border-radius:18px;padding:12px;display:flex;flex-direction:column;gap:2px}
.kpi b{font-family:var(--display);font-size:1.9rem;line-height:1.1;font-variant-numeric:tabular-nums}.kpi span{font-size:.85rem;color:var(--muted);font-weight:700}
.wk{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:6px;height:150px}
.wkc{display:flex;flex-direction:column;align-items:center;gap:4px;min-width:0}

.c1{width:90px;top:30px;left:8%}.c2{width:70px;top:90px;right:10%}.c3{width:110px;top:170px;left:40%;opacity:.6}

.mi{background:var(--surface);border:3px solid var(--line);border-radius:18px;min-height:72px;display:flex;align-items:center;justify-content:center;padding:4px}

.rails{width:100%;overflow:hidden;padding:6px 0 12px;border-bottom:6px solid #8F9BAA;position:relative}
.rails::after{content:"";position:absolute;left:0;right:0;bottom:-2px;height:4px;background:repeating-linear-gradient(90deg,#6B5A45 0 6px,transparent 6px 22px)}
.train{display:flex;direction:ltr;align-items:flex-end;gap:6px;justify-content:center;transition:transform 1.2s ease-in}
.train.go{transform:translateX(-140%)}
.eng svg{width:84px;transform:scaleX(-1)}
.wagon{position:relative;width:62px;height:58px;background:#4C8DF6;border-radius:12px 12px 6px 6px;display:grid;place-items:center;margin-bottom:10px}

.wagon.full{background:#2BA88A}.wagon.full .ar{animation:pop .3s}
.wagon i{position:absolute;bottom:-11px;width:18px;height:18px;border-radius:50%;background:#16324F;border:4px solid #FFC83D}.wagon i:first-of-type{left:6px}.wagon i:last-of-type{right:6px}

nav{background:#FFFFFF;border-top:3px solid var(--line)}

<script>
/* ================= LETTERS & MARKS ================= */
const L=[["ا","Alif","أَلِف"],["ب","Ba","بَاء"],["ت","Ta","تَاء"],["ث","Tha","ثَاء"],["ج","Jeem","جِيم"],["ح","Ḥa","حَاء"],["خ","Kha","خَاء"],["د","Dal","دَال"],["ذ","Dhal","ذَال"],["ر","Ra","رَاء"],["ز","Zay","زَاي"],["س","Seen","سِين"],["ش","Sheen","شِين"],["ص","Ṣad","صَاد"],["ض","Ḍad","ضَاد"],["ط","Ṭa","طَاء"],["ظ","Ẓa","ظَاء"],["ع","ʿAyn","عَيْن"],["غ","Ghayn","غَيْن"],["ف","Fa","فَاء"],["ق","Qaf","قَاف"],["ك","Kaf","كَاف"],["ل","Lam","لَام"],["م","Meem","مِيم"],["ن","Noon","نُون"],["ه","Ha","هَاء"],["و","Waw","وَاو"],["ي","Ya","يَاء"]];
const ALL=L.map(l=>l[0]);
const NAME=c=>L[ALL.indexOf(c)]||["","",""];
const TR={ا:"ʾ",ب:"b",ت:"t",ث:"th",ج:"j",ح:"ḥ",خ:"kh",د:"d",ذ:"dh",ر:"r",ز:"z",س:"s",ش:"sh",ص:"ṣ",ض:"ḍ",ط:"ṭ",ظ:"ẓ",ع:"ʿ",غ:"gh",ف:"f",ق:"q",ك:"k",ل:"l",م:"m",ن:"n",ه:"h",و:"w",ي:"y",ء:"ʾ"};
const NOJOIN="ادذرزو";
const base=c=>c==="ا"?"أ":c;
const hamz=c=>c==="ا"?"ء":c;
const without=s=>ALL.filter(c=>!s.includes(c));
const COLS=["var(--sun)","var(--leaf)","var(--coral)","var(--sky)"];

const MARKS=[
 {n:"Fatḥa",m:"َ",f:c=>base(c)+"َ",t:c=>TR[c]+"a"},
 {n:"Kasra",m:"ِ",f:c=>(c==="ا"?"إ":c)+"ِ",t:c=>TR[c]+"i"},
 {n:"Ḍamma",m:"ُ",f:c=>base(c)+"ُ",t:c=>TR[c]+"u"},
 {n:"Fatḥatān",m:"ً",f:c=>c==="ا"?"ءً":c+"ًا",t:c=>TR[c]+"an"},
 {n:"Kasratān",m:"ٍ",f:c=>hamz(c)+"ٍ",t:c=>TR[c]+"in"},
 {n:"Ḍammatān",m:"ٌ",f:c=>hamz(c)+"ٌ",t:c=>TR[c]+"un"},
 {n:"Sukūn",m:"ْ",f:c=>"أَ"+c+"ْ",t:c=>"a"+TR[c],noAlif:true},
 {n:"Shadda",m:"ّ",f:c=>"أَ"+c+"َّ",t:c=>"a"+TR[c]+TR[c]+"a",noAlif:true},
];
const MADD=[
 {n:"Alif madd",f:c=>c==="ا"?"آ":c+"َا",t:c=>TR[c]+"ā"},
 {n:"Yāʾ madd",f:c=>(c==="ا"?"إ":c)+"ِي",t:c=>TR[c]+"ī"},
 {n:"Wāw madd",f:c=>base(c)+"ُو",t:c=>TR[c]+"ū"},
];
const LEEN=[
 {n:"Wāw līn",f:c=>base(c)+"َوْ",t:c=>TR[c]+"aw"},
 {n:"Yāʾ līn",f:c=>base(c)+"َيْ",t:c=>TR[c]+"ay"},
];

/* ================= ITEM LESSONS ================= */
const JOINED="لا بت تث جح حخ خد ذر زس سش شص صض ضط طظ ظع عغ غف فق قك كل لم من نه هو وي يب بن تي".split(" ").map(p=>({
  big:p,title:[...p].map(c=>NAME(c)[1]).join(" + "),sub:[...p].join(" + "),read:[...p].map(c=>NAME(c)[2]).join(" ، "),
  note:[...p].some(c=>NOJOIN.includes(c))?"Watch out: ا د ذ ر ز و never hold hands with the next letter.":"Say each letter's name, then find where they hold hands."}));
const MUQ=[
 ["الٓمٓ","أَلِفْ لَآمْ مِيمْ","Al-Baqarah, Āl ʿImrān and 4 more"],["الٓمٓصٓ","أَلِفْ لَآمْ مِيمْ صَآدْ","Al-Aʿrāf"],["الٓر","أَلِفْ لَآمْ رَا","Yūnus, Hūd, Yūsuf, Ibrāhīm, Al-Ḥijr"],["الٓمٓر","أَلِفْ لَآمْ مِيمْ رَا","Ar-Raʿd"],
 ["كٓهيعٓصٓ","كَافْ هَا يَا عَيْنْ صَآدْ","Maryam"],["طه","طَا هَا","Ṭā Hā"],["طسٓمٓ","طَا سِينْ مِيمْ","Ash-Shuʿarāʾ, Al-Qaṣaṣ"],["طسٓ","طَا سِينْ","An-Naml"],
 ["يسٓ","يَا سِينْ","Yā Sīn"],["صٓ","صَآدْ","Ṣād"],["حمٓ","حَا مِيمْ","7 sūrahs, Ghāfir to Al-Aḥqāf"],["حمٓ عٓسٓقٓ","حَا مِيمْ عَيْنْ سِينْ قَآفْ","Ash-Shūrā"],["قٓ","قَآفْ","Qāf"],["نٓ","نُونْ","Al-Qalam"],
].map(([big,read,s])=>({big,title:"Read: "+read,sub:"Opens "+s,read,ar:true,note:"Read each letter by its name. Names with 3 sounds (مِيمْ، لَآمْ) stretch 6 counts. Names with 2 sounds (طَا، هَا، رَا) stretch 2 counts."}));
const SMALL=[
 {big:"ـٰ",title:"Standing fatḥa",sub:"A little alif on top. Read it like a long ā, 2 counts.",ex:["هَٰذَا","الرَّحْمَٰنِ","ذَٰلِكَ"]},
 {big:"ـۥ",title:"Small wāw",sub:"After هُ, stretch the u for 2 counts.",ex:["لَهُۥ","إِنَّهُۥ","رَبَّهُۥ"]},
 {big:"ـۦ",title:"Small yāʾ",sub:"After هِ, stretch the i for 2 counts.",ex:["بِهِۦ","رَبِّهِۦ","فِيهِۦ"]},
 {big:"ـٓ",title:"Maddah",sub:"The wavy line means stretch longer: 4 to 6 counts.",ex:["جَآءَ","السَّمَآءِ","وَلَا الضَّآلِّينَ"]},
];
const SILENT=[
 {big:"ٱ",title:"Hamzat al-waṣl",sub:"Read it when you start with it. Skip it when you join from the word before.",ex:["ٱهْدِنَا","ٱلْحَمْدُ","وَٱلْعَصْرِ"]},
 {big:"ـُوا",title:"Silent alif after wāw",sub:"The alif after وا at the end of a verb is not read.",ex:["قَالُوا","ءَامَنُوا","عَمِلُوا"]},
 {big:"أَنَا",title:"Short alif in أَنَا",sub:"Read 'ana' short when you keep going. Stretch only when you stop.",ex:["أَنَا","لَٰكِنَّا"]},
 {big:"أُولَٰ",title:"Silent wāw",sub:"In أُولَٰئِكَ the wāw is written but not read.",ex:["أُولَٰئِكَ","أُولُوا"]},
 {big:"مِائَة",title:"Silent alif in مِائَة",sub:"Read it 'mi-ah'. The alif is not read.",ex:["مِائَةَ","مِائَتَيْنِ"]},
];
const WAQF=[
 {big:"مـ",sign:"ۘ",title:"Must stop",sub:"Lāzim: you must stop here, or the meaning changes.",ex:["Look for a small م above the line"]},

 {big:"ج",sign:"ۚ",title:"Stopping is allowed",sub:"Jāʾiz: stopping or continuing are both fine.",ex:["Small ج above the line"]},
 {big:"صلى",sign:"ۖ",title:"Better to continue",sub:"You may stop, but continuing is better.",ex:["Small صلى above the line"]},
 {big:"قلى",sign:"ۗ",title:"Better to stop",sub:"You may continue, but stopping is better.",ex:["Small قلى above the line"]},
 {big:"∴ ∴",sign:"ۛ",title:"Stop at one, not both",sub:"Two sets of 3 dots: stop at one of them only.",ex:["Seen in ذَٰلِكَ الْكِتَابُ لَا رَيْبَ ۛ فِيهِ ۛ"]},
 {big:"۝",sign:"۝",title:"End of an āyah",sub:"The circle ends a verse. A good place to stop and breathe.",ex:["The number inside tells you which āyah it is"]},
];
/* Qurʾān text: Uthmani script from The Noble Qurʾān Encyclopedia (QuranEnc, King Fahd Complex mushaf),

/* ================= SOUND EFFECTS (made in the app, no files) ================= */
let AC=null;
const soundOn=()=>S.sound!==false;
function tone(f,t,d,type="sine",vol=.18,f2){
  const o=AC.createOscillator(),g=AC.createGain();o.type=type;o.frequency.setValueAtTime(f,t);
  if(f2)o.frequency.exponentialRampToValueAtTime(f2,t+d);
  g.gain.setValueAtTime(0,t);g.gain.linearRampToValueAtTime(vol,t+.015);g.gain.exponentialRampToValueAtTime(.0001,t+d);
  o.connect(g);g.connect(AC.destination);o.start(t);o.stop(t+d+.05);
}
function sfx(kind){
  if(!soundOn())return;
  try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();if(AC.state==="suspended")AC.resume();}catch(e){return}
  const t=AC.currentTime+.01;
  if(kind==="tap")tone(880,t,.06,"triangle",.05);
  if(kind==="good"){tone(659,t,.18,"sine",.16);tone(880,t+.09,.18,"sine",.16);tone(1319,t+.18,.32,"sine",.13)}
  if(kind==="bad"){tone(330,t,.28,"triangle",.10,220)}
  if(kind==="win"){[523,659,784,1047].forEach((f,i)=>tone(f,t+i*.12,.35,"sine",.15));tone(1568,t+.5,.6,"sine",.08);tone(2093,t+.62,.5,"sine",.06)}
}
/* after any button press: cheerful if it was right, soft if not, tiny tick otherwise */
document.addEventListener("click",e=>{
  const b=e.target.closest&&e.target.closest("button");if(!b||b.id==="snd")return;
  if(b.classList.contains("good")||b.classList.contains("pop")){sfx("good");reactRight(b)}
  else if(b.classList.contains("bad")){sfx("bad");reactWrong(b)}
  else sfx("tap");
});

/* Real qari recordings go in AUDIO: { "بَ": "audio/ba.mp3", ... }. Anything missing falls back to the device voice. */
/* Qari recordings go here, e.g. { "بَ": "audio/ba.m4a" }. Until then, nothing plays. */
const AUDIO={};
const hasAudio=()=>Object.keys(AUDIO).length>0;
let curAudio=null;
function say(text){
  if(!AUDIO[text])return false;
  try{if(curAudio)curAudio.pause();curAudio=new Audio(AUDIO[text]);curAudio.play().catch(()=>{})}catch(e){}
  return true;
}
function tapSay(text){say(text)}
const shuffle=a=>a.map(v=>[Math.random(),v]).sort((x,y)=>x[0]-y[0]).map(x=>x[1]);
const pick=a=>a[Math.floor(Math.random()*a.length)];
function wireSay(){view.querySelectorAll("[data-say]").forEach(b=>b.onclick=()=>tapSay(b.dataset.say))}
let rec=null,chunks=[],lastURL=null;
async function toggleRec(btn,playBtn,note){
  if(rec&&rec.state==="recording"){rec.stop();return}
  try{
    const stream=await navigator.mediaDevices.getUserMedia({audio:true});
    rec=new MediaRecorder(stream);chunks=[];
    rec.ondataavailable=e=>chunks.push(e.data);
    rec.onstop=()=>{stream.getTracks().forEach(t=>t.stop());btn.classList.remove("live");btn.innerHTML=bi("🎙 اقْرَأْ","Say it");
      if(lastURL)URL.revokeObjectURL(lastURL);lastURL=URL.createObjectURL(new Blob(chunks));playBtn.hidden=false;note.innerHTML=bi("اسْتَمِعْ إِلَى صَوْتِكَ","Listen to yourself");star()};
    rec.start();btn.classList.add("live");btn.innerHTML=bi("■ تَوَقَّفْ","Stop");
  }catch(e){note.innerHTML=bi("الْمِيكْرُوفُون غَيْرُ مُتَاحٍ هُنَا","The microphone is blocked in this preview. It works in the real app.")}
}

/* ================= PARENT GATE & PAYWALL ================= */
let gateUntil=0;
function parentGate(then,backTo=learn){
  if(OPEN_ALL||Date.now()<gateUntil)return then();
  const a=3+Math.floor(Math.random()*6),b=4+Math.floor(Math.random()*6),ans=a*b;
  const opts=shuffle([ans,ans+a,ans-b,ans+b+1]);
  top0();
  view.innerHTML=`<div class="focus gate">${bi("لِلْكِبَارِ فَقَط","Grown-ups only","h")}<p>To continue, please solve: what is ${a} × ${b}?</p>
  <div class="choices">${opts.map(o=>`<button class="num" data-n="${o}">${o}</button>`).join("")}</div><button class="btn ghost" id="cancel">${T.back}</button></div>`;
  $("#cancel").onclick=backTo;
  view.querySelectorAll("[data-n]").forEach(b=>b.onclick=()=>{if(+b.dataset.n===ans){gateUntil=Date.now()+5*60e3;then()}else{b.classList.add("bad");setTimeout(backTo,500)}});
}
function paywall(a,e){
  top0();
  view.innerHTML=`<div class="focus"><div class="big" style="font-size:4rem">🔒</div>${bi(a,e,"h")}
  ${bi("هَذَا لِلْأَعْضَاء","This is for members")}
  <p>A family membership unlocks every level, all tajwīd lessons and all games, for all your children.</p>
  <div class="row"><button class="btn" id="ask">${bi("اسْأَلْ وَالِدَيْكَ","Ask a grown-up")}</button><button class="btn ghost" id="bk2">${T.back}</button></div></div>`;
  $("#bk2").onclick=learn;$("#ask").onclick=()=>parentGate(parents);
}

function finishLevel(k){
  sfx("win");award("أَنْهَيْتَ مُسْتَوًى 🌟");
  const u=UNITS[k],kd=kid();
  if(!kd.done.includes(u.id))kd.done.push(u.id);star(3);
  top0();
  const d=new Date().toLocaleDateString("ar",{year:"numeric",month:"long",day:"numeric"});
  view.innerHTML=`<div class="cert"><div class="cert-in">
   <div class="ar cert-top">مَا شَاءَ اللَّه</div>${bi("شَهَادَةُ إِتْمَام","Certificate of completion")}
   <h1><bdi>${escH(kd.name)}</bdi></h1>${bi("أَتَمَّ الْمُسْتَوَى "+AN(k+1),"finished level "+(k+1))}${bi(u.a,u.name,"h")}
   <div class="cert-stars">★ ★ ★</div><span class="lvl ar">${d} · ★ ${AN(kd.stars)}</span></div></div>

  <div class="row">${k+1<UNITS.length?`<button class="btn" id="nx">${bi(UNITS[k+1].a+" ←","Next: "+UNITS[k+1].name)}</button>`:""}<button class="btn ghost" id="pt">${bi("الطَّرِيق","Back to path")}</button></div>`;
  $("#pt").onclick=learn;if($("#nx"))$("#nx").onclick=()=>openUnit(k+1,0);
}

function openUnit(k,i){
  const u=UNITS[k];top0();
  if(!unlocked(u))return paywall(u.a,u.name);
  if(u.id==="letters")return letters(k,i);
  if(u.id==="shapes")return shapes(k,i);
  if(u.items)return itemLesson(k,i);
  if(u.id==="reading")return reading(0,0);
  if(u.id==="tajweed")return tajweed();
  if(u.id==="quran")return quranIndex();
  return marks(k,i);
}

/* confetti */
const reduceMotion=()=>window.matchMedia&&matchMedia("(prefers-reduced-motion: reduce)").matches;
function confetti(x,y,n=40){
  if(reduceMotion()||!window.requestAnimationFrame)return;
  let c=$("#confetti");if(!c){c=document.createElement("canvas");c.id="confetti";document.body.appendChild(c)}
  const dpr=window.devicePixelRatio||1;c.width=innerWidth*dpr;c.height=innerHeight*dpr;const g=c.getContext("2d");g.scale(dpr,dpr);
  const cols=["#F3D27E","#7FC6AE","#F4A99A","#8FB8E3","#BFA6EC"];
  const ps=Array.from({length:n},()=>({x:x??innerWidth/2,y:y??innerHeight/3,vx:(Math.random()-.5)*9,vy:Math.random()*-9-3,r:Math.random()*5+3,c:pick1(cols),a:Math.random()*6,s:Math.random()<.5}));
  let f=0;if(window.cancelAnimationFrame)cancelAnimationFrame(confetti.raf);
  (function tick(){g.clearRect(0,0,innerWidth,innerHeight);ps.forEach(p=>{p.vy+=.32;p.x+=p.vx;p.y+=p.vy;p.a+=.2;g.save();g.translate(p.x,p.y);g.rotate(p.a);g.fillStyle=p.c;
    if(p.s)g.fillRect(-p.r,-p.r/2,p.r*2,p.r);else{g.beginPath();g.arc(0,0,p.r/1.4,0,7);g.fill()}g.restore()});
    if(++f<90)confetti.raf=requestAnimationFrame(tick);else g.clearRect(0,0,innerWidth,innerHeight)})();
}

const lastDays=n=>Array.from({length:n},(_,i)=>new Date(Date.now()-(n-1-i)*864e5).toISOString().slice(0,10));
const TIPS=[
 ["Little and often","10 minutes every day works better than one long session a week."],

function weekBars(k){
  const days=lastDays(7),vals=days.map(d=>Math.round((k.log&&k.log[d]?k.log[d].min:0))),mx=Math.max(10,...vals);
  const names=days.map(d=>new Date(d+"T12:00").toLocaleDateString("en",{weekday:"short"}));
  return `<div class="wk">${vals.map((v,i)=>`<div class="wkc"><span class="wkv">${v||""}</span><div class="wkb"><span style="height:${v/mx*100}%"></span></div><span class="wkd">${names[i]}</span></div>`).join("")}</div>`;
}
function weekStats(k){
  const days=lastDays(7),L=k.log||{};
  const min=Math.round(days.reduce((n,d)=>n+(L[d]?L[d].min:0),0)),act=days.filter(d=>L[d]&&L[d].min>=1).length;
  return {min,act};
}
function weakLetters(k){return Object.entries(k.miss||{}).filter(([,v])=>v>=2).sort((a,b)=>b[1]-a[1]).slice(0,6).map(([c])=>c)}
function strongCount(k){const learned=new Set();(k.done||[]).forEach(id=>{if(["letters","shapes","harakat"].includes(id))ALL.forEach(c=>learned.add(c))});return learned.size}

/* ---------- 1 & 2: floating bubbles / swimming fish ---------- */
function floatGame(skin){
  const id=skin,NEED=6,TIME=45,q=g2Q();let hits=0,left=TIME,items=[],alive=true,last=performance.now(),spawnT=0;
  view.innerHTML=`${g2Head(id)}<div class="ftarget"><span class="lvl ar">${skin==="fishing"?"اصْطَدْ":"افْقَعْ"}</span>${promptHTML(q)}</div>
   <div class="dots">${Array.from({length:NEED},()=>`<span></span>`).join("")}</div>
   <div class="timer"><span id="tbar"></span></div>
   <div class="stage sk-${skin}" id="stage">${skin==="fishing"?`<div class="sand"></div><div class="weed w1"></div><div class="weed w2"></div><div class="weed w3"></div>`:`<div class="cloud c1"></div><div class="cloud c2"></div><div class="cloud c3"></div>`}</div>`;
  $("#bk").onclick=()=>{alive=false;play()};
  const st=$("#stage"),W=()=>st.clientWidth||360,H=()=>st.clientHeight||400;
  function spawn(){
    const ok=Math.random()<.5,txt=ok?q.ans:pick(q.wrong);
    const b=document.createElement("button");b.className="fl "+(skin==="fishing"?"fsh":"bbl")+(q.pic||g2Mode==="words"?" wd":"");
    if(ok)b.dataset.ok=1;
    const col=pick(FISHCOL);
    b.innerHTML=skin==="fishing"?`${ART.fish(col)}<span class="ar ft">${txt}</span>`:`<span class="ar">${txt}</span>`;
    if(skin!=="fishing")b.style.setProperty("--bc",col);
    st.appendChild(b);
    const it={el:b,ok,ph:Math.random()*6};
    if(skin==="fishing"){const fromL=Math.random()<.5;it.x=fromL?-130:W()+10;it.y=40+Math.random()*(H()-150);it.vx=(fromL?1:-1)*(45+Math.random()*35);it.vy=0;if(!fromL)b.classList.add("flip")}
    else{it.x=10+Math.random()*(W()-100);it.y=H()+10;it.vx=0;it.vy=-(45+Math.random()*30)}
    b.onclick=()=>{if(b.disabled||!alive)return;
      if(it.ok){b.disabled=true;b.classList.add("pop");hits++;view.querySelectorAll(".dots span")[hits-1]?.classList.add("on");
        setTimeout(()=>b.remove(),350);items=items.filter(x=>x!==it);if(hits>=NEED){alive=false;setTimeout(()=>g2End(id,true,hits,NEED),600)}}
      else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400)}};
    items.push(it);
  }
  for(let i=0;i<3;i++)spawn();
  (function loop(now){
    if(!alive||!st.isConnected)return;
    const dt=Math.min(.05,(now-last)/1000);last=now;left-=dt;spawnT+=dt;
    if(spawnT>(skin==="fishing"?.9:.8)){spawnT=0;if(items.length<9)spawn()}
    items.forEach(it=>{it.ph+=dt*2;it.x+=it.vx*dt+(skin==="fishing"?0:Math.sin(it.ph)*.6);it.y+=it.vy*dt+(skin==="fishing"?Math.sin(it.ph)*.5:0);it.el.style.transform=`translate(${it.x}px,${it.y}px)`});
    items=items.filter(it=>{const gone=it.y<-110||it.x<-150||it.x>W()+150;if(gone)it.el.remove();return !gone});
    const tb=$("#tbar");if(tb)tb.style.width=Math.max(0,left/TIME*100)+"%";
    if(left<=0){alive=false;return g2End(id,false,hits,NEED)}
    requestAnimationFrame(loop);
  })(performance.now());
}

/* ---------- 3: camel race ---------- */
function raceGame(){
  const GOAL=10;let me=0,rival=0,alive=true,score=0;
  const rivalEvery=6.5;let rt=0,last=performance.now();
  function draw(){
    const p=x=>`calc(${(x/GOAL)*82}% + 4px)`;
    $("#c1").style.insetInlineStart=p(me);$("#c2").style.insetInlineStart=p(rival);
  }
  function ask(){
    if(!alive)return;
    const q=g2Q(),opts=shuffle([q.ans,...q.wrong.slice(0,3)]);
    $("#rq").innerHTML=`<div class="ftarget">${promptHTML(q)}</div><div class="choices ${g2Mode==="words"?"rwords":""}">${opts.map(o=>`<button ${o===q.ans?"data-ok=1":""}><span class="ar">${o}</span></button>`).join("")}</div>`;
    $("#rq").querySelectorAll("button").forEach(b=>b.onclick=()=>{
      if(!alive)return;
      if(b.dataset.ok){b.classList.add("good");score++;me++;draw();
        if(me>=GOAL){alive=false;$("#c1").classList.add("winner");return setTimeout(()=>g2End("race",true,score,GOAL),900)}
        setTimeout(ask,450)}
      else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400)}});
  }
  view.innerHTML=`${g2Head("race")}<div class="track">
    <div class="lane"><span class="lname ar">أَنْت</span><div class="racer" id="c1">${ART.camel("#C98A4B")}</div></div>
    <div class="lane"><span class="lname ar">المُنَافِس</span><div class="racer" id="c2">${ART.camel("#8F9BAA")}</div></div>
    <div class="finish">${ART.flag()}</div></div><div id="rq"></div>`;
  $("#bk").onclick=()=>{alive=false;play()};
  draw();ask();
  (function loop(now){
    if(!alive||!$("#c2"))return;
    rt+=(now-last)/1000;last=now;
    if(rt>rivalEvery){rt=0;rival++;draw();if(rival>=GOAL){alive=false;return setTimeout(()=>g2End("race",false,score,GOAL),700)}}
    requestAnimationFrame(loop);
  })(performance.now());
}

/* ---------- 4: missing letter ---------- */
function missingGame(round,score){
  const N=8;if(round>=N)return g2End("missing",score>=6,score,N);
  const pool=g2Words().filter(w=>{const l=[...bare(w.t)].filter(c=>c!=="ّ");return l.length>=3&&l.length<=6});
  const w=pick(pool),ls=[...bare(w.t)].filter(c=>c!=="ّ");
  let k=1+Math.floor(Math.random()*(ls.length-1));if(ls[k]==="ا"&&k>1)k--;
  const ans=ls[k],wrong=uniq([...famOf(ans),...shuffle(ALL.filter(c=>c!==ans))]).filter(c=>c!==ans).slice(0,2);
  const opts=shuffle([ans,...wrong]);
  const shown=ls.map((c,i)=>i===k?`<b class="gap">؟</b>`:c).join("");
  view.innerHTML=`${g2Head("missing",`<span class="meter ar">★ ${AN(score)}</span>`)}<span class="lvl ar">${AN(round+1)} مِنْ ${AN(N)}</span><div class="bar"><span style="width:${round/N*100}%"></span></div>
  <div class="focus"><span class="em huge mpic">${w.e}</span><div class="mword ar" id="mw">${shown}</div>${bi("أَيُّ حَرْفٍ نَاقِص؟","Which letter is missing?")}
  <div class="choices">${opts.map(o=>`<button ${o===ans?"data-ok=1":""}><span class="ar">${o}</span></button>`).join("")}</div><p class="note ar fb" id="why"></p></div>`;
  $("#bk").onclick=play;let miss=false;
  view.querySelectorAll(".choices button").forEach(b=>b.onclick=()=>{
    if(b.dataset.ok){b.classList.add("good");$("#mw").textContent=w.t;$("#mw").classList.add("full");$("#why").textContent=T.good;star();setTimeout(()=>missingGame(round+1,score+(miss?0:1)),1300)}
    else{miss=true;b.classList.add("bad");$("#why").textContent=T.again;setTimeout(()=>b.classList.remove("bad"),400)}});
}

/* ---------- 5: match pairs (tap one on each side) ---------- */
function matchPairs(){
  if(g2Mode==="words")return shuffle(g2Words()).slice(0,4).map(w=>[w.t,`<span class="em">${w.e}</span>`]);
  if(g2Mode==="harakat"){const c=pick(ALL.slice(1));return shuffle(MARKS.slice(0,3)).map(m=>[m.f(c),`<span class="ar">${m.a}</span>`]).concat([[MARKS[7].f(c),`<span class="ar">${MARKS[7].a}</span>`]])}
  return shuffle(ALL).slice(0,4).map(c=>[c,`<span class="ar">${NAME(c)[2]}</span>`]);
}
function matchGame(round,score){
  const R=3;if(round>=R)return g2End("match",true,score,R*4);
  const pairs=matchPairs(),right=shuffle(pairs.map((p,i)=>({i,h:`<span class="ar big3">${p[0]}</span>`}))),leftS=shuffle(pairs.map((p,i)=>({i,h:p[1]})));
  view.innerHTML=`${g2Head("match",`<span class="meter ar">${AN(round+1)} مِنْ ${AN(R)}</span>`)}${bi("اضْغَطْ عَلَى زَوْجَيْنِ مُتَشَابِهَيْن","Tap two that belong together")}
  <div class="mboard" id="mb"><svg class="mlines" id="ml"></svg>
   <div class="mcol">${right.map(x=>`<button class="mi" data-s="r" data-i="${x.i}">${x.h}</button>`).join("")}</div>
   <div class="mcol">${leftS.map(x=>`<button class="mi" data-s="l" data-i="${x.i}">${x.h}</button>`).join("")}</div></div>`;
  $("#bk").onclick=play;
  let sel=null,done=0;
  const line=(a,b)=>{const B=$("#mb").getBoundingClientRect(),A=a.getBoundingClientRect(),C=b.getBoundingClientRect();
    const x1=A.left-B.left+(A.left<C.left?A.width:0),y1=A.top-B.top+A.height/2,x2=C.left-B.left+(C.left<A.left?C.width:0),y2=C.top-B.top+C.height/2;
    $("#ml").insertAdjacentHTML("beforeend",`<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}"/>`)};
  view.querySelectorAll(".mi").forEach(b=>b.onclick=()=>{
    if(b.disabled)return;
    if(!sel||sel.dataset.s===b.dataset.s){view.querySelectorAll(".mi.sel").forEach(x=>x.classList.remove("sel"));sel=b;b.classList.add("sel");return}
    if(sel.dataset.i===b.dataset.i){sel.classList.remove("sel");[sel,b].forEach(x=>{x.disabled=true;x.classList.add("matched")});b.classList.add("good");line(sel,b);score++;done++;sel=null;
      if(done===4){star(1);setTimeout(()=>matchGame(round+1,score),900)}}
    else{b.classList.add("bad");const s=sel;setTimeout(()=>{b.classList.remove("bad");s.classList.remove("sel")},400);sel=null}
  });
}

/* ---------- 6: word train ---------- */
function trainGame(round,score){
  const N=6;if(round>=N)return g2End("train",true,score,N);
  const pool=g2Words().filter(w=>{const n=[...bare(w.t)].filter(c=>c!=="ّ").length;return n>=2&&n<=5});
  const w=pick(pool),ls=[...bare(w.t)].filter(c=>c!=="ّ"),extra=shuffle(uniq(ls.flatMap(famOf))).filter(c=>!ls.includes(c)).slice(0,2);
  const tiles=shuffle([...ls.map((c,k)=>({c,k})),...extra.map(c=>({c,k:-1}))]);let pos=0;
  window.spellHint=()=>[...view.querySelectorAll(".ltile")].find(b=>!b.disabled&&b.textContent===ls[pos]);
  view.innerHTML=`${g2Head("train",`<span class="meter ar">${AN(round+1)} مِنْ ${AN(N)}</span>`)}
  <div class="focus"><span class="em huge mpic">${w.e}</span>${bi("امْلَأِ العَرَبَات بِالتَّرْتِيب","Fill the wagons in order")}
   <div class="tbuilt ar" id="tbuilt">&nbsp;</div><div class="rails"><div class="train" id="tr" style="--n:${ls.length}"><div class="eng">${ART.engine()}</div>${ls.map((c,k)=>`<div class="wagon" data-k="${k}"><span class="ar"></span><i></i><i></i></div>`).reverse().join("")}</div></div>
   <div class="tiles">${tiles.map((t,j)=>`<button class="ltile ar" data-t="${j}">${t.c}</button>`).join("")}</div>
   <p class="note ar fb" id="why"></p></div>`;
  $("#bk").onclick=play;
  view.querySelectorAll("[data-t]").forEach(b=>b.onclick=()=>{
    const t=tiles[+b.dataset.t];if(b.disabled)return;
    if(t.c===ls[pos]){b.disabled=true;b.classList.add("good");view.querySelectorAll(".ltile.hint").forEach(x=>x.classList.remove("hint"));const tb=b.closest(".tiles");if(tb)tb.dataset.miss=0;
      const wg=view.querySelector(`.wagon[data-k="${pos}"]`);wg.classList.add("full");wg.querySelector(".ar").textContent=t.c;pos++;$("#tbuilt").textContent=ls.slice(0,pos).join("");
      if(pos===ls.length){star();$("#tbuilt").textContent=w.t;$("#why").textContent=T.good+" "+w.t;$("#tr").classList.add("go");setTimeout(()=>trainGame(round+1,score+1),1700)}}
    else{b.classList.add("bad");setTimeout(()=>b.classList.remove("bad"),400)}});
}


/* ================= GAME LAYOUT: every game fits exactly in the visible area ================= */
function fitGame(){
  const main=document.querySelector("main"),bk=document.querySelector("#bk");
  const isGame=!!bk&&/Games/.test(bk.textContent)&&!!view.querySelector(".choices,.stage,.track,.mboard,.rails,.mem,.bubbles,[data-add]")&&!view.querySelector(".gate");
  main.classList.toggle("gm",isGame);
  if(isGame){const cs=getComputedStyle(main);view.style.setProperty("--gh",(main.clientHeight-parseFloat(cs.paddingTop)-parseFloat(cs.paddingBottom))+"px");main.scrollTop=0}
}
new MutationObserver(()=>fitGame()).observe(view,{childList:true});
addEventListener("resize",fitGame);

  view.querySelectorAll("[data-a]").forEach(b=>b.onclick=()=>{av=b.dataset.a;view.querySelectorAll("[data-a]").forEach(x=>x.classList.toggle("on",x===b))});
  $("#add").onsubmit=e=>{e.preventDefault();const n=$("#kidname").value.trim();if(!n){$("#kidname").focus();return toast("Type a name first")}

}
