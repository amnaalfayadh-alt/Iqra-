name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v5

      - uses: actions/setup-node@v5
        with:
          node-version: 20

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: 17

      - name: Install app tools
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build test app (APK, for your phone)
        run: |
          cd android && chmod +x gradlew
          set -o pipefail
          ./gradlew assembleDebug --stacktrace 2>&1 | tee "$RUNNER_TEMP/build.log" || {
            grep -E "What went wrong|error:|Error|Exception|Could not|> " "$RUNNER_TEMP/build.log" | head -25 | while IFS= read -r line; do echo "::error::$line"; done
            exit 1
          }

      - name: Prepare signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Google Play file (AAB)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease

      - name: Save test app
        uses: actions/upload-artifact@v5
        with:
          name: Iqra-Steps-phone-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save Google Play file
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v5
        with:
          name: Iqra-Steps-Google-Play-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab

      - name: Publish a download link for your phone
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          cp android/app/build/outputs/apk/debug/app-debug.apk Iqra-Steps.apk
          if gh release view latest >/dev/null 2>&1; then
            gh release upload latest Iqra-Steps.apk --clobber
          else
            gh release create latest Iqra-Steps.apk --title "Iqra Steps (latest test app)" --notes "Open this page on your Android phone and tap Iqra-Steps.apk to install." --latest
          fi
