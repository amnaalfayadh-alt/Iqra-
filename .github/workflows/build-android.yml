name: Build Android app

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      BUILD_NUMBER: ${{ github.run_number }}
      HAS_KEY: ${{ secrets.KEYSTORE_BASE64 != '' }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Install app tools
        run: npm ci

      - name: Copy the app into the Android project
        run: npx cap sync android

      - name: Build test app (APK, for your phone)
        run: cd android && chmod +x gradlew && ./gradlew assembleDebug

      - name: Prepare signing key
        if: env.HAS_KEY == 'true'
        run: |
          echo "${{ secrets.KEYSTORE_BASE64 }}" | base64 -d > "$RUNNER_TEMP/upload.jks"
          echo "KEYSTORE_FILE=$RUNNER_TEMP/upload.jks" >> "$GITHUB_ENV"

      - name: Build Google Play file (AAB)
        if: env.HAS_KEY == 'true'
        env:
          KEYSTORE_PASSWORD: ${{ secrets.KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: cd android && ./gradlew bundleRelease

      - name: Save test app
        uses: actions/upload-artifact@v4
        with:
          name: Iqra-Steps-phone-test-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk

      - name: Save Google Play file
        if: env.HAS_KEY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Iqra-Steps-Google-Play-AAB
          path: android/app/build/outputs/bundle/release/app-release.aab
